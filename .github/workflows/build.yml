name: Build APK
# Same idea as the Jabra Keyboard workflow (condensed):
#  - always builds the NEWEST main, push retry, zips in the repo root are applied in version order
#  - zip is checked BEFORE main is touched (must contain app/build.gradle with appVersionName)
#  - heads-up checks (version number, CHANGELOG, debug-key warning)
#  - network hiccup = ONE automatic retry, main is NOT reverted for a hiccup
#  - compile error = main is put back to the last good release
#  - re-run safe, SHA-256 shown, plain-English report, build log saved when it fails
#  - manual REVERT (revert_to input)
# Output: FakeSmsPrank-v<ver>-b<run>.apk, release tag v<ver>-b<run> (the in-app updater reads exactly this).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revert_to:
        description: 'REVERT (leave empty for a normal build). Type: previous | latest | a release tag like v1.0.0-b5 | a commit id'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fakesms-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare helpers
        run: |
          : > "$RUNNER_TEMP/warn.md"
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          push_main() {
            local i
            for i in 1 2 3 4; do
              if git push origin HEAD:main; then return 0; fi
              echo "Push rejected, main changed. Taking the newest main and trying again ($i/4)..."
              if ! git pull --rebase origin main; then git rebase --abort 2>/dev/null || true; return 1; fi
              sleep $((i * 3))
            done
            return 1
          }
          newest_tag() { git tag -l 'v*-b*' | sed -E 's/^.*-b([0-9]+)$/\1 &/' | sort -rn | head -n1 | cut -d' ' -f2; }
          EOF

      - name: Revert source to an older release (only when revert_to is filled)
        id: revert
        if: ${{ github.event.inputs.revert_to != '' }}
        env:
          REVERT_TO: ${{ github.event.inputs.revert_to }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          git fetch --tags --force
          TAGS=$(git tag -l 'v*-b*' | sed -E 's/^.*-b([0-9]+)$/\1 &/' | sort -rn | cut -d' ' -f2)
          T="$(echo "$REVERT_TO" | tr -d '[:space:]')"
          case "$T" in
            latest)   T=$(echo "$TAGS" | sed -n 1p) ;;
            previous) T=$(echo "$TAGS" | sed -n 2p) ;;
          esac
          if [ -z "$T" ] || ! git rev-parse -q --verify "${T}^{commit}" >/dev/null; then
            echo "::error::'$REVERT_TO' not found."
            {
              echo "### Revert problem - nothing was changed"
              echo
              echo "**What to do:** Run workflow again and type: latest, previous, or one of these tags:"
              echo '```'
              echo "$TAGS" | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          SHA=$(git rev-parse "${T}^{commit}")
          rm -rf _old; mkdir _old
          git archive "$SHA" | tar -x -C _old
          rm -rf _old/.github
          git ls-files -z | grep -zv '^\.github/' | xargs -0 -r rm -f --
          cp -a _old/. .
          rm -rf _old
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -m "Revert source to $T (${SHA:0:7})" || echo "source already identical"
          push_main || { echo "::error::Could not push the revert."; exit 1; }
          echo "REVERTED_FROM=$T" >> "$GITHUB_ENV"

      - name: Apply uploaded zip(s)
        id: apply
        if: ${{ github.event.inputs.revert_to == '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          source "$RUNNER_TEMP/helpers.sh"
          fail() {
            echo "::error::$1"
            { echo "### Upload problem - main was NOT changed"; echo; echo "**What happened:** $1"; echo; echo "**What to do:** $2"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          zver()    { local v; v=$(echo "$1" | grep -oP '_v\K[0-9_]+(?=\.zip)' || true); v="${v//_/.}"; echo "${v:-0}"; }
          cur_ver() { grep -oP 'appVersionName = "\K[^"]+' app/build.gradle 2>/dev/null || echo 0; }

          LIST=$(for Z in *.zip; do echo "$(zver "$Z") $Z"; done | sort -V | cut -d' ' -f2-)
          APPLIED=""; SKIPPED=""
          if [ -n "$LIST" ]; then
            while IFS= read -r Z; do
              unzip -tq "$Z" >/dev/null 2>&1 || fail "The zip file \"$Z\" is damaged." "Upload it again. If the damaged file is still in the repo root, delete it by hand first."
            done <<< "$LIST"
            while IFS= read -r Z; do
              V=$(zver "$Z"); CUR=$(cur_ver)
              if [ "$V" != "0" ] && [ "$V" != "$CUR" ] && [ "$(printf '%s\n%s\n' "$V" "$CUR" | sort -V | tail -n1)" = "$CUR" ]; then
                echo "Skipping $Z: version $V is older than $CUR"
                SKIPPED="$SKIPPED $Z"; rm -f "$Z"; continue
              fi
              echo "Applying $Z"
              rm -rf _tmp; mkdir _tmp
              unzip -oq "$Z" -d _tmp
              SRC=_tmp
              if [ "$(ls -A _tmp | wc -l)" = "1" ] && [ -d "_tmp/$(ls -A _tmp)" ]; then SRC="_tmp/$(ls -A _tmp)"; fi
              rm -rf "$SRC/.github"
              if [ -f "$SRC/DELETE.txt" ]; then
                while IFS= read -r P; do
                  P="${P%$'\r'}"
                  case "$P" in ""|\#*|/*|*..*|.git*) continue;; esac
                  rm -rf -- "./$P"
                done < "$SRC/DELETE.txt"
                rm -f "$SRC/DELETE.txt"
              fi
              cp -a "$SRC"/. .
              rm -f "$Z"
              APPLIED="$APPLIED $Z"
            done <<< "$LIST"
            rm -rf _tmp
            if [ -n "$APPLIED" ]; then
              [ -f app/build.gradle ] || fail "After applying$APPLIED the file app/build.gradle is missing." "Make sure the zip has one root folder and contains app/build.gradle."
              grep -q 'appVersionName = "' app/build.gradle || fail "After applying$APPLIED the line appVersionName = \"...\" is missing in app/build.gradle." "Ask for a corrected zip."
            fi
            git config user.name "build-bot"
            git config user.email "build-bot@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Apply uploaded zip:${APPLIED:- (only removed old zips)}"
              push_main || fail "GitHub rejected the push 4 times in a row." "Wait until no other run is active, then Re-run all jobs. The zip is still in the repo."
            fi
          fi
          {
            echo "### Upload step"
            if [ -n "$APPLIED" ]; then echo "- Applied (oldest first):$APPLIED"; fi
            if [ -n "$SKIPPED" ]; then echo "- Skipped (a NEWER version is already on main):$SKIPPED"; fi
            if [ -z "$APPLIED" ] && [ -z "$SKIPPED" ]; then echo "- No zip was waiting. This run builds the current main."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide if a build is needed
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          T=$(newest_tag)
          if [ -n "$T" ] && git diff --quiet "$T" HEAD -- . ':(exclude).github' ':(exclude)*.zip'; then
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
            {
              echo "### No build needed"
              echo
              echo "The app code on main is the same as release **$T**. For a new build anyway: Actions > Build APK > Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Heads-up checks (warnings only)
        if: ${{ env.SKIP_BUILD != '1' && github.event.inputs.revert_to == '' }}
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          W="$RUNNER_TEMP/warn.md"
          VER=$(grep -oP 'appVersionName = "\K[^"]+' app/build.gradle || true)
          if ! echo "$VER" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
            echo "- The version \"$VER\" in app/build.gradle looks unusual (expected like 1.0.1)." >> "$W"
          fi
          TOP=$(head -n1 CHANGELOG.txt 2>/dev/null | tr -d '\r' || true)
          case "$TOP" in
            "$VER"*) ;;
            *) echo "- The first line of CHANGELOG.txt does not start with $VER, so the release notes may describe the wrong version." >> "$W" ;;
          esac
          T=$(newest_tag)
          if [ -n "$T" ]; then
            LAST=${T#v}; LAST=${LAST%-b*}
            if [ "$VER" = "$LAST" ] && ! git diff --quiet "$T" HEAD -- . ':(exclude).github' ':(exclude)*.zip'; then
              echo "- The code changed but the version is still $VER (same as $T). Raise appVersionName so you can tell builds apart." >> "$W"
            fi
          fi
          cat "$W" || true

      - uses: actions/setup-java@v5
        if: ${{ env.SKIP_BUILD != '1' }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ env.SKIP_BUILD != '1' }}
        with:
          gradle-version: '8.7'

      - name: Prepare signing (only if secrets exist)
        if: ${{ env.SKIP_BUILD != '1' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "SIGNED=your own key" >> "$GITHUB_ENV"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "SIGNED=DEBUG key (no keystore secret)" >> "$GITHUB_ENV"
            echo "- No keystore secret is set, so the APK uses a throw-away DEBUG key. GitHub can use a different debug key on another run, and then the phone refuses to update the old app (\"App not installed\"). Fix once: Settings > Secrets and variables > Actions > add KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see README.txt)." >> "$RUNNER_TEMP/warn.md"
          fi

      - name: Build
        id: build
        if: ${{ env.SKIP_BUILD != '1' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          START=$(date +%s)
          run_gradle() { gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee "$LOG"; return "${PIPESTATUS[0]}"; }
          is_net() {
            ! grep -qE '^e: |\.java:[0-9]+: error: ' "$LOG" &&
            grep -qiE 'Could not resolve|Could not GET|Could not HEAD|Read timed out|Connect timed out|Connection reset|Received status code 5[0-9][0-9]|SSLHandshake|Premature end of Content-Length|Unable to tunnel|Remote host terminated' "$LOG"
          }
          set +e
          run_gradle; RC=$?
          if [ "$RC" -ne 0 ] && is_net; then
            echo "::warning::Looks like a network hiccup. Trying ONE more time in 20 seconds..."
            echo "RETRIED=1" >> "$GITHUB_ENV"
            sleep 20
            run_gradle; RC=$?
          fi
          echo "BUILD_SECS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          if [ "$RC" -ne 0 ]; then
            if is_net; then echo "NET_FAIL=1" >> "$GITHUB_ENV"; fi
            exit 1
          fi

      - name: Auto-revert main if the build failed
        if: ${{ failure() && steps.build.outcome == 'failure' && env.NET_FAIL != '1' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          git fetch --tags --force
          T=$(newest_tag)
          if [ -z "$T" ]; then echo "::warning::No release to restore, main left as it is"; exit 0; fi
          SHA=$(git rev-parse "${T}^{commit}")
          FAILED=$(git rev-parse --short HEAD)
          if [ -z "$(git diff --name-only "$SHA" HEAD -- . ':(exclude).github')" ]; then exit 0; fi
          rm -rf _old; mkdir _old
          git archive "$SHA" | tar -x -C _old
          rm -rf _old/.github
          git ls-files -z | grep -zv '^\.github/' | xargs -0 -r rm -f --
          cp -a _old/. .
          rm -rf _old
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -m "Auto-revert: build failed, source restored to $T (failed commit $FAILED)" || true
          push_main
          MSG="Build FAILED. main was restored to the source of $T. The failed change is still in history as commit $FAILED (to bring it back: Run workflow with revert_to = $FAILED)."
          echo "::error::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the build log (only when the build failed)
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: ${{ env.SKIP_BUILD != '1' }}
        with:
          name: FakeSmsPrank-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        id: publish
        if: ${{ env.SKIP_BUILD != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$RUNNER_TEMP/helpers.sh"
          VER=$(grep -oP 'appVersionName = "\K[^"]+' app/build.gradle)
          TAG="v${VER}-b${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "### Release already exists - nothing to do ($TAG)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APK=$(ls app/build/outputs/apk/*/*.apk | head -n1)
          APKNAME="FakeSmsPrank-${TAG}.apk"
          cp "$APK" "$APKNAME"
          APKSIZE=$(stat -c%s "$APKNAME"); APKSHA=$(sha256sum "$APKNAME" | cut -d' ' -f1)

          awk 'NR==1{next} /^[[:space:]]*$/{exit} {print}' CHANGELOG.txt | head -c 100000 > notes.txt || true
          [ -s notes.txt ] || echo "Build ${GITHUB_RUN_NUMBER}" > notes.txt
          TITLE="Fake SMS Prank ${VER} (build ${GITHUB_RUN_NUMBER})"
          if [ -n "${REVERTED_FROM:-}" ]; then
            { echo "REVERT: this build has the source of ${REVERTED_FROM}"; cat notes.txt; } > notes2.txt && mv notes2.txt notes.txt
            TITLE="${TITLE} - revert to ${REVERTED_FROM}"
          fi
          gh release create "$TAG" "$APKNAME" \
            --title "$TITLE" \
            --notes-file notes.txt \
            --target "$(git rev-parse HEAD)" || exit 1
          {
            echo "### SUCCESS - build is GREEN"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | **$TAG** ([open](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})) |"
            echo "| App version | $VER (build $GITHUB_RUN_NUMBER) |"
            echo "| APK | $APKNAME - $(numfmt --to=iec "$APKSIZE") |"
            echo "| Signed with | ${SIGNED:-unknown} |"
            echo "| Build time | $(( ${BUILD_SECS:-0} / 60 )) min $(( ${BUILD_SECS:-0} % 60 )) s${RETRIED:+ (needed 1 automatic retry)} |"
            echo "| SHA-256 | $APKSHA |"
            echo
            echo "On the phone: open the app > Check for updates > Update > Install."
            if [ -s "$RUNNER_TEMP/warn.md" ]; then
              echo
              echo "### Heads-up (the build worked, but please read)"
              echo
              cat "$RUNNER_TEMP/warn.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain what went wrong (plain English)
        if: ${{ failure() }}
        run: |
          S="$GITHUB_STEP_SUMMARY"
          LOG="$RUNNER_TEMP/build.log"
          if [ "${{ steps.apply.outcome }}" = "failure" ] || [ "${{ steps.revert.outcome }}" = "failure" ]; then
            exit 0
          elif [ "${{ steps.build.outcome }}" = "failure" ] && [ "${NET_FAIL:-}" = "1" ]; then
            {
              echo "### BUILD STOPPED - a download / network problem (not your code)"
              echo
              echo "Gradle could not download something, even after one retry. No code error was found, so main was NOT reverted. Click **Re-run failed jobs**. Do NOT upload the zip again."
            } >> "$S"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            {
              echo "### BUILD FAILED - the app code has an error"
              echo
              echo "The upload worked, but the compiler stopped. Errors (file, line, message):"
              echo
              echo '```'
              if [ -f "$LOG" ]; then
                { grep -E '\.java:[0-9]+: error: ' "$LOG" | sed -E 's#^.*/([^/]+\.java):([0-9]+): error: (.*)#\1, line \2: \3#' ;
                  grep -E '^e: ' "$LOG" | sed -E 's#^e: (file://)?.*/([^/]+\.kt):([0-9]+):[0-9]+:? (.*)#\2, line \3: \4#' ; } | awk '!seen[$0]++' | head -n 25
                if ! grep -qE '^e: |\.java:[0-9]+: error: ' "$LOG"; then
                  echo "(no single code line named; main reason:)"
                  grep -A6 'What went wrong' "$LOG" | head -n 12 || true
                fi
              else
                echo "(no build log found)"
              fi
              echo '```'
              echo
              echo "Do NOT click Re-run. main was put back to the last good version. Paste the lines above in the chat to get a fix. Full log: Artifacts > build-log."
            } >> "$S"
          elif [ "${{ steps.publish.outcome }}" = "failure" ]; then
            {
              echo "### BUILD OK, but the RELEASE could not be published"
              echo
              echo "Click **Re-run failed jobs** once. It is safe: an existing release is not created twice."
            } >> "$S"
          else
            {
              echo "### Run FAILED before the build started"
              echo
              echo "A setup step failed (Java / Gradle download or a GitHub hiccup). Click **Re-run failed jobs** once."
            } >> "$S"
          fi
